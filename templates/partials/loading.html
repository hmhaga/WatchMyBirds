<div id="loading" role="status" aria-label="Loading">
  <div class="loading-content">
    <div class="loading-spinner" aria-hidden="true">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="14" r="5"/>
        <circle cx="75.46" cy="24.54" r="5"/>
        <circle cx="86" cy="50" r="5"/>
        <circle cx="75.46" cy="75.46" r="5"/>
        <circle cx="50" cy="86" r="5"/>
        <circle cx="24.54" cy="75.46" r="5"/>
        <circle cx="14" cy="50" r="5"/>
        <circle cx="24.54" cy="24.54" r="5"/>
      </svg>
    </div>
  </div>
</div>

<style>
  #loading {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    place-items: center;

    /* Semi-transparent blurred background */
    background: rgb(255 255 255 / 38%);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  #loading.show {
    display: grid;
  }

  .loading-content {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .loading-spinner {
    display: block;
    width: 64px;
    height: 64px;
    color: #0078d4;
    animation: loading-spin 1s linear infinite;
  }

  .loading-spinner svg {
    display: block;
    width: 100%;
    height: 100%;
    fill: currentColor;
  }

  .loading-spinner circle:nth-child(1) { opacity: 1; }
  .loading-spinner circle:nth-child(2) { opacity: 0.88; }
  .loading-spinner circle:nth-child(3) { opacity: 0.76; }
  .loading-spinner circle:nth-child(4) { opacity: 0.64; }
  .loading-spinner circle:nth-child(5) { opacity: 0.52; }
  .loading-spinner circle:nth-child(6) { opacity: 0.4; }
  .loading-spinner circle:nth-child(7) { opacity: 0.28; }
  .loading-spinner circle:nth-child(8) { opacity: 0.16; }

  @keyframes loading-spin {
    to { transform: rotate(360deg); }
  }
</style>

<script>
(() => {
  const loading = document.getElementById("loading");

  function showLoading() {
    loading.classList.add("show");
  }

  // Internal navigation
  document.addEventListener("click", event => {
    if (!(event.target instanceof Element)) return;

    const link = event.target.closest("a");

    if (!link || event.defaultPrevented ||
        event.button !== 0 ||
        event.metaKey || event.ctrlKey ||
        event.shiftKey || event.altKey ||
        (link.target && link.target !== "_self") ||
        link.hasAttribute("download")) return;

    const url = new URL(link.href, location.href);

    if (url.origin === location.origin &&
        url.href !== location.href) {
      showLoading();
    }
  });

  // Form submissions
  document.addEventListener("submit", event => {
    if (!event.defaultPrevented) showLoading();
  });

  // Back/forward cache
  window.addEventListener("pageshow", event => {
    if (event.persisted) {
      loading.classList.remove("show");
    }
  });

})();
</script>
