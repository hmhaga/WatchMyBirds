<div id="loading" role="status" aria-label="Loading">
  <div class="loading-spinner" aria-hidden="true">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="14" r="5" opacity="1"/>
      <circle cx="75.46" cy="24.54" r="5" opacity="0.88"/>
      <circle cx="86" cy="50" r="5" opacity="0.76"/>
      <circle cx="75.46" cy="75.46" r="5" opacity="0.64"/>
      <circle cx="50" cy="86" r="5" opacity="0.52"/>
      <circle cx="24.54" cy="75.46" r="5" opacity="0.4"/>
      <circle cx="14" cy="50" r="5" opacity="0.28"/>
      <circle cx="24.54" cy="24.54" r="5" opacity="0.16"/>
    </svg>
  </div>
</div>

<style>
  #loading {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    place-items: center;

    background: var(--color-bg, #f3f3f2);
  }

  #loading.show {
    display: grid;
  }

  .loading-spinner {
    display: block;
    width: 64px;
    height: 64px;
    color: #0078d4;
    animation: loading-spin 1s linear infinite;
  }

  .loading-spinner svg {
    display: block;
    width: 100%;
    height: 100%;
    fill: currentColor;
  }

  @keyframes loading-spin {
    to { transform: rotate(360deg); }
  }
</style>

<script>
(() => {
  const loading = document.getElementById("loading");

  function showLoading() {
    loading.classList.add("show");
  }

  // Internal navigation
  document.addEventListener("click", event => {
    if (!(event.target instanceof Element)) return;

    const link = event.target.closest("a");

    if (!link || event.defaultPrevented ||
        event.button !== 0 ||
        event.metaKey || event.ctrlKey ||
        event.shiftKey || event.altKey ||
        (link.target && link.target !== "_self") ||
        link.hasAttribute("download")) return;

    const url = new URL(link.href, location.href);

    if (url.origin === location.origin &&
        url.href !== location.href) {
      showLoading();
    }
  });

  // Form submissions
  document.addEventListener("submit", event => {
    if (!event.defaultPrevented) showLoading();
  });

  // Back/forward cache
  window.addEventListener("pageshow", event => {
    if (event.persisted) {
      loading.classList.remove("show");
    }
  });

})();
</script>
